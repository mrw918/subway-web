<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>知识路线图</title>
    <link rel="stylesheet" href="./css/node-hover-card.css?v=23" />
    <link rel="stylesheet" href="./css/roadmap-interactions.css?v=23" />
    <link rel="stylesheet" href="./css/role-select.css?v=19" />
    <style>
      :root {
        color-scheme: light;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --tap-min: 44px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overflow-x: hidden;
        overscroll-behavior-x: none;
        background: #ffffff;
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #2c292a;
      }

      input,
      textarea,
      select {
        font-size: 16px;
      }

      button,
      a,
      input,
      textarea,
      select,
      .role-link,
      .back-btn,
      .roadmap-search-list__item,
      .role-select__avatar-btn,
      .role-select__entre,
      .role-select__nav {
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(75, 103, 175, 0.16);
      }

      .page {
        width: 100%;
        max-width: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      .home-view[hidden],
      .role-select[hidden],
      .roadmap-view[hidden] {
        display: none !important;
      }

      .roadmap-view {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        overflow-x: hidden;
      }

      .roadmap-toolbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(6px + var(--safe-top)) calc(14px + var(--safe-right)) 6px
          calc(14px + var(--safe-left));
        border-bottom: 1px solid rgba(28, 37, 92, 0.08);
        background: rgba(255, 255, 255, 0.96);
      }

      .roadmap-toolbar__meta {
        min-width: 0;
        flex: 1 1 auto;
      }

      .back-btn {
        border: 0;
        background: transparent;
        color: #dc2626;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        min-height: 34px;
        min-width: 34px;
        padding: 6px 10px;
        border-radius: 8px;
        white-space: nowrap;
      }

      @media (hover: hover) and (pointer: fine) {
        .back-btn:hover {
          background: rgba(220, 38, 38, 0.1);
        }
      }

      .roadmap-title {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        color: #1c255c;
      }

      .roadmap-error {
        position: absolute;
        top: calc(52px + var(--safe-top));
        left: calc(16px + var(--safe-left));
        right: calc(16px + var(--safe-right));
        z-index: 11;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(220, 53, 69, 0.08);
        color: #b42318;
        font-size: 13px;
        line-height: 1.5;
      }

      #role-list .roadmap-error {
        margin: 0;
        list-style: none;
      }

      .stage-shell {
        position: absolute;
        inset: 0;
        flex: none;
        min-height: 0;
        background: #ffffff;
        display: flex;
        padding: 0;
      }

      .svg-hover-stage {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .roadmap-loading {
        margin: 24px;
        color: #5a6170;
        font-size: 14px;
      }

      .roadmap-view--enter:not(.roadmap-view--enter-active) {
        display: flex;
      }

      @media (max-width: 768px) {
        .roadmap-view {
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        .roadmap-toolbar {
          position: relative;
          flex: 0 0 auto;
          display: flex;
          flex-wrap: nowrap;
          align-items: center;
          gap: 10px;
          overflow-x: auto;
          overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 8px;
        }

        .roadmap-toolbar::-webkit-scrollbar {
          display: none;
        }

        .back-btn,
        .roadmap-toolbar__meta,
        .roadmap-search-wrap {
          flex: 0 0 auto;
        }

        .roadmap-toolbar__meta {
          max-width: 42vw;
        }

        .roadmap-title {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          font-size: 13px;
          line-height: 1.35;
        }

        .roadmap-search-wrap {
          margin-left: 0;
          width: min(220px, 58vw);
          min-width: 160px;
        }

        .roadmap-search-input {
          width: 100%;
        }

        .roadmap-error {
          position: relative;
          top: auto;
          left: auto;
          right: auto;
          margin: 8px 12px 0;
        }

        .stage-shell {
          position: relative;
          inset: auto;
          flex: 1 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          touch-action: manipulation;
        }

        #roadmap-stage.svg-hover-stage,
        .svg-hover-stage {
          position: relative;
          flex: 0 0 55vh;
          width: 100%;
          min-width: 0;
          height: 55vh;
          max-height: 55vh;
          overflow: hidden;
          background: #fff;
        }

        .svg-hover-stage svg {
          width: 100%;
          min-width: 0;
          max-width: 100%;
          height: 100%;
          transform-origin: 0 0;
          will-change: transform;
          touch-action: manipulation;
        }

        .info-panel {
          flex: 0 0 35vh;
          width: 100%;
          max-width: none;
          max-height: 35vh;
          height: 35vh;
          border-left: 0;
          border-top: 1px solid rgba(28, 37, 92, 0.1);
          padding: 14px 16px calc(14px + var(--safe-bottom));
          overflow: auto;
          -webkit-overflow-scrolling: touch;
          background: #ffffff;
        }

        .info-panel[hidden] {
          display: block !important;
        }
      }

      @media (max-width: 480px) {
        .roadmap-search-wrap {
          width: min(200px, 55vw);
          min-width: 148px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section id="home-view" class="role-select"></section>

      <section id="roadmap-view" class="roadmap-view" hidden>
        <header class="roadmap-toolbar">
          <button id="back-btn" class="back-btn" type="button">← 返回选择</button>
          <div class="roadmap-toolbar__meta">
            <h2 id="roadmap-title" class="roadmap-title"></h2>
          </div>
            <div class="roadmap-search-wrap">
            <input
              id="roadmap-search"
              class="roadmap-search-input"
              type="search"
              placeholder="搜索站点关键词…"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <div id="roadmap-search-results" class="roadmap-search-results" hidden></div>
          </div>
        </header>
        <p id="roadmap-error" class="roadmap-error" hidden></p>
        <div class="stage-shell">
          <div id="roadmap-stage" class="svg-hover-stage"></div>
          <aside id="info-panel" class="info-panel" hidden>
            <h3 class="info-panel__title">请选择路线或站点</h3>
            <p class="info-panel__desc">悬停或点击左侧查看详情。</p>
          </aside>
        </div>
      </section>
    </main>

    <script src="./js/roadmaps.js?v=21"></script>
    <script src="./js/node-data.js?v=11"></script>
    <script src="./js/node-data-network-test.js?v=11"></script>
    <script src="./js/node-data-diagnostic.js?v=2"></script>
    <script src="./js/node-data-embedded.js?v=4"></script>
    <script src="./js/node-data-mbse.js?v=1"></script>
    <script src="./js/node-data-soa.js?v=1"></script>
    <script src="./js/node-data-calibration.js?v=1"></script>
    <script src="./js/svg-roadmap-layers.js?v=6"></script>
    <script src="./js/svg-hover-card.js?v=21"></script>
    <script src="./js/route-presets.js?v=3"></script>
    <script src="./js/svg-roadmap-graph.js?v=16"></script>
    <script src="./js/svg-roadmap-interactions.js?v=28"></script>
    <script src="./js/role-select.js?v=17"></script>
    <script src="./js/app.js?v=23"></script>
  </body>
</html>
