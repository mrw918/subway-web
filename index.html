<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识路线图</title>
    <link rel="stylesheet" href="./css/node-hover-card.css?v=18" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #2c292a;
      }

      .page {
        width: 100%;
        height: 100%;
      }

      .home-view {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
      }

      .home-panel {
        width: min(560px, 100%);
      }

      .home-title {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        color: #1c255c;
        letter-spacing: 0.02em;
      }

      .home-subtitle {
        margin: 0 0 28px;
        font-size: 14px;
        color: #5a6170;
      }

      .role-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .role-link {
        display: block;
        padding: 14px 18px;
        border-radius: 10px;
        border: 1px solid rgba(28, 37, 92, 0.1);
        background: #fff;
        color: #1c255c;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease;
      }

      .role-link:hover {
        background: rgba(75, 103, 175, 0.06);
        border-color: rgba(75, 103, 175, 0.28);
        transform: translateX(4px);
      }

      .roadmap-view {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .roadmap-toolbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(28, 37, 92, 0.08);
        background: rgba(255, 255, 255, 0.96);
      }

      .back-btn {
        border: 0;
        background: transparent;
        color: #4b67af;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 8px;
        border-radius: 6px;
      }

      .back-btn:hover {
        background: rgba(75, 103, 175, 0.08);
      }

      .roadmap-title {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        color: #1c255c;
      }

      .roadmap-error {
        margin: 12px 16px 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(220, 53, 69, 0.08);
        color: #b42318;
        font-size: 13px;
        line-height: 1.5;
      }

      #role-list .roadmap-error {
        margin: 0;
        list-style: none;
      }

      .stage-shell {
        flex: 1;
        min-height: 0;
        background: #ffffff;
      }

      .svg-hover-stage {
        width: 100%;
        height: 100%;
      }

      .roadmap-loading {
        margin: 24px;
        color: #5a6170;
        font-size: 14px;
      }

      .home-view[hidden],
      .roadmap-view[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section id="home-view" class="home-view">
        <div class="home-panel">
          <h1 class="home-title">知识路线图</h1>
          <p class="home-subtitle">请选择工程师方向，点击进入对应路线图</p>
          <ul id="role-list" class="role-list"></ul>
        </div>
      </section>

      <section id="roadmap-view" class="roadmap-view" hidden>
        <header class="roadmap-toolbar">
          <button id="back-btn" class="back-btn" type="button">← 返回选择</button>
          <h2 id="roadmap-title" class="roadmap-title"></h2>
        </header>
        <p id="roadmap-error" class="roadmap-error" hidden></p>
        <div class="stage-shell">
          <div id="roadmap-stage" class="svg-hover-stage"></div>
        </div>
      </section>
    </main>

    <script src="./js/roadmaps.js?v=15"></script>
    <script src="./js/node-data.js?v=11"></script>
    <script src="./js/node-data-network-test.js?v=11"></script>
    <script src="./js/node-data-diagnostic.js?v=2"></script>
    <script src="./js/node-data-embedded.js?v=3"></script>
    <script src="./js/node-data-mbse.js?v=1"></script>
    <script src="./js/node-data-soa.js?v=1"></script>
    <script src="./js/svg-hover-card.js?v=18"></script>
    <script src="./js/app.js?v=13"></script>
  </body>
</html>
