<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>知识路线图</title>
    <link rel="stylesheet" href="./css/fonts.css?v=1" />
    <link rel="stylesheet" href="./css/node-hover-card.css?v=41" />
    <link rel="stylesheet" href="./css/roadmap-interactions.css?v=54" />
    <link rel="stylesheet" href="./css/role-select.css?v=61" />
    <style>
      :root {
        color-scheme: light;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --tap-min: 44px;
        --font-ui: "Noto Sans CJK SC", "Noto Sans CJK SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overflow-x: hidden;
        overscroll-behavior-x: none;
        background: #ffffff;
        font-family: var(--font-ui);
        color: #2c292a;
      }

      input,
      textarea,
      select {
        font-size: 16px;
      }

      button,
      a,
      input,
      textarea,
      select,
      .role-link,
      .back-btn,
      .roadmap-search-list__item,
      .role-select__avatar-btn,
      .role-select__entre,
      .role-select__nav {
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(75, 103, 175, 0.16);
      }

      .page {
        width: 100%;
        max-width: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      .home-view[hidden],
      .role-select[hidden],
      .roadmap-view[hidden] {
        display: none !important;
      }

      .roadmap-view {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        overflow-x: hidden;
      }

      .roadmap-toolbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(6px + var(--safe-top)) calc(14px + var(--safe-right)) 6px
          calc(14px + var(--safe-left));
        border-bottom: 1px solid rgba(28, 37, 92, 0.08);
        background: rgba(255, 255, 255, 0.96);
      }

      .roadmap-toolbar__bar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1 1 auto;
      }

      .roadmap-toolbar__meta {
        display: none;
      }

      .back-btn {
        border: 0;
        background: transparent;
        color: #dc2626;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        min-height: 34px;
        min-width: 34px;
        padding: 6px 10px;
        border-radius: 8px;
        white-space: nowrap;
      }

      @media (hover: hover) and (pointer: fine) {
        .back-btn:hover {
          background: rgba(220, 38, 38, 0.1);
        }
      }

      .roadmap-title {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        color: #1c255c;
      }

      .roadmap-error {
        position: absolute;
        top: calc(52px + var(--safe-top));
        left: calc(16px + var(--safe-left));
        right: calc(16px + var(--safe-right));
        z-index: 11;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(220, 53, 69, 0.08);
        color: #b42318;
        font-size: 13px;
        line-height: 1.5;
      }

      #role-list .roadmap-error {
        margin: 0;
        list-style: none;
      }

      .stage-shell {
        position: absolute;
        inset: 0;
        top: calc(48px + var(--safe-top));
        flex: none;
        min-height: 0;
        background: #ffffff;
        display: flex;
        padding: 0;
      }

      @media (min-width: 1920px) {
        .roadmap-toolbar {
          gap: 18px;
          padding: calc(10px + var(--safe-top)) calc(22px + var(--safe-right)) 10px
            calc(22px + var(--safe-left));
        }

        .roadmap-toolbar__bar {
          gap: 18px;
        }

        .back-btn {
          font-size: 18px;
          min-height: 48px;
          min-width: 48px;
          padding: 10px 16px;
          border-radius: 10px;
        }

        .roadmap-title {
          font-size: 18px;
        }

        .stage-shell {
          top: calc(68px + var(--safe-top));
        }

        .roadmap-error {
          top: calc(72px + var(--safe-top));
          font-size: 16px;
          padding: 12px 16px;
        }
      }

      .svg-hover-stage {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .svg-hover-stage svg {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }

      .roadmap-loading {
        margin: 24px;
        color: #5a6170;
        font-size: 14px;
      }

      .roadmap-view--enter:not(.roadmap-view--enter-active) {
        display: flex;
      }

      @media (max-width: 768px) {
        .roadmap-view {
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        .roadmap-toolbar {
          position: relative;
          flex: 0 0 auto;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
          overflow: visible;
          padding: calc(8px + var(--safe-top)) calc(14px + var(--safe-right)) 10px
            calc(14px + var(--safe-left));
        }

        .roadmap-toolbar__bar {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
          align-items: center;
          gap: 8px;
          width: 100%;
        }

        .back-btn {
          grid-column: 1;
          justify-self: start;
          padding-left: 0;
        }

        .roadmap-toolbar__meta {
          grid-column: 2;
          flex: none;
          max-width: min(52vw, 240px);
          text-align: center;
        }

        .roadmap-title {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          font-size: 14px;
          line-height: 1.35;
        }

        .roadmap-search-wrap {
          margin-left: 0;
          width: 100%;
          min-width: 0;
        }

        .roadmap-search-input {
          width: 100%;
          min-height: 40px;
          padding: 8px 16px 8px 40px;
          border-radius: 20px;
        }

        .roadmap-error {
          position: relative;
          top: auto;
          left: auto;
          right: auto;
          margin: 8px 12px 0;
        }

        .stage-shell {
          position: relative;
          inset: auto;
          flex: 1 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          touch-action: none;
        }

        #roadmap-stage.svg-hover-stage,
        .svg-hover-stage {
          position: relative;
          flex: 1 1 auto;
          width: 100%;
          min-width: 0;
          min-height: 0;
          height: auto;
          max-height: none;
          overflow: hidden;
          background: #fff;
          touch-action: none;
        }

        .svg-hover-stage svg {
          width: 100%;
          min-width: 0;
          max-width: 100%;
          height: 100%;
          transform-origin: 0 0;
          touch-action: none;
        }

        .info-panel {
          display: flex;
          flex-direction: column;
          flex: 0 0 auto;
          width: 100%;
          max-width: none;
          max-height: 25vh;
          height: auto;
          border-left: 0;
          border-top: 1px solid rgba(28, 37, 92, 0.1);
          padding: 12px 16px calc(12px + var(--safe-bottom));
          overflow: auto;
          -webkit-overflow-scrolling: touch;
          background: #ffffff;
        }

        .info-panel[hidden] {
          display: flex !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section id="home-view" class="role-select"></section>

      <section id="roadmap-view" class="roadmap-view" hidden>
        <header class="roadmap-toolbar">
          <div class="roadmap-toolbar__bar">
            <button id="back-btn" class="back-btn" type="button">← 返回选择</button>
            <div class="roadmap-toolbar__meta">
              <h2 id="roadmap-title" class="roadmap-title"></h2>
            </div>
          </div>
          <div class="roadmap-search-wrap">
            <svg class="roadmap-search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M11 11l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              id="roadmap-search"
              class="roadmap-search-input"
              type="search"
              placeholder="搜索站点名称/关键字..."
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <div id="roadmap-search-results" class="roadmap-search-results" hidden></div>
          </div>
        </header>
        <p id="roadmap-error" class="roadmap-error" hidden></p>
        <div class="stage-shell">
          <div id="roadmap-stage" class="svg-hover-stage"></div>
          <aside id="info-panel" class="info-panel" hidden>
            <h3 class="info-panel__title">请选择路线或站点</h3>
            <p class="info-panel__desc">悬停或点击左侧查看详情。</p>
          </aside>
        </div>
      </section>
    </main>

    <script src="./js/roadmaps.js?v=29"></script>
    <script src="./js/node-data.js?v=14"></script>
    <script src="./js/node-data-network-test.js?v=14"></script>
    <script src="./js/node-data-diagnostic.js?v=7"></script>
    <script src="./js/node-data-embedded.js?v=8"></script>
    <script src="./js/node-data-mbse.js?v=3"></script>
    <script src="./js/node-data-soa.js?v=2"></script>
    <script src="./js/node-data-calibration.js?v=2"></script>
    <script src="./js/svg-roadmap-layers.js?v=25"></script>
    <script src="./js/svg-hover-card.js?v=24"></script>
    <script src="./js/route-presets.js?v=7"></script>
    <script src="./js/svg-roadmap-graph.js?v=54"></script>
    <script src="./js/svg-roadmap-interactions.js?v=62"></script>
    <script src="./js/training-events.js?v=4"></script>
    <script src="./js/role-select.js?v=35"></script>
    <script src="./js/app.js?v=44"></script>
  </body>
</html>
